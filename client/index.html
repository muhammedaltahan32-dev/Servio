<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Servio</title>
		<style>
			:root {
				color-scheme: light;
				--loader-background: #f3f6fa;
				--loader-primary: #0067c0;
				--loader-text: #536477;
				--loader-brand-text: #ffffff;
				--loader-track: rgba(0, 103, 192, 0.14);
			}

			:root.dark,
			:root[data-mui-color-scheme="dark"] {
				color-scheme: dark;
				--loader-background: #15181d;
				--loader-primary: #60cdff;
				--loader-text: #c4c4c4;
				--loader-brand-text: #00344f;
				--loader-track: rgba(255, 255, 255, 0.12);
			}

			@media (prefers-color-scheme: dark) {
				:root:not(.light):not([data-mui-color-scheme="light"]) {
					color-scheme: dark;
					--loader-background: #15181d;
					--loader-primary: #60cdff;
					--loader-text: #c4c4c4;
					--loader-brand-text: #00344f;
					--loader-track: rgba(255, 255, 255, 0.12);
				}
			}

			#appLoader {
				position: fixed;
				inset: 0;
				height: 100dvh;
				width: 100dvw;
				z-index: 999999999;
				display: flex;
				align-items: center;
				justify-content: center;
				background-color: var(--loader-background);
				background-image:
					radial-gradient(
						ellipse at 50% 44%,
						color-mix(in srgb, var(--loader-primary) 9%, transparent),
						transparent 48%
					),
					linear-gradient(145deg, color-mix(in srgb, var(--loader-primary) 2%, transparent), transparent 55%);
				opacity: 1;
				visibility: visible;
				transition:
					opacity 0.4s ease,
					visibility 0.4s ease;
				overflow: hidden;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
			}

			/* Removal State */
			#appLoader.loaded {
				opacity: 0 !important;
				visibility: hidden !important;
				pointer-events: none !important;
			}

			.loader-container {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 12px;
				position: relative;
				z-index: 1;
				box-sizing: border-box;
				width: min(280px, calc(100vw - 40px));
				height: 236px;
				flex: 0 0 auto;
				padding: 22px;
				border: 1px solid color-mix(in srgb, var(--loader-primary) 12%, transparent);
				border-radius: 22px;
				background: color-mix(in srgb, var(--loader-background) 58%, transparent);
				box-shadow: 0 20px 56px rgba(18, 34, 52, 0.12), inset 0 1px 0 color-mix(in srgb, white 42%, transparent);
				backdrop-filter: blur(32px) saturate(165%);
				-webkit-backdrop-filter: blur(32px) saturate(165%);
				contain: layout paint size;
			}

			.glow-bg {
				position: absolute;
				width: 280px;
				height: 280px;
				border-radius: 50%;
				background: radial-gradient(circle, var(--loader-primary) 0%, transparent 70%);
				opacity: 0.12;
				filter: blur(48px);
				pointer-events: none;
			}

			.loader-ring-wrapper {
				position: relative;
				width: 56px;
				height: 56px;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.loader-track {
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 2px solid var(--loader-track);
			}

			.loader-spinner {
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 2px solid transparent;
				border-top-color: var(--loader-primary);
				border-right-color: color-mix(in srgb, var(--loader-primary) 28%, transparent);
				animation: loader-spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
			}

			.brand-mark {
				width: 38px;
				height: 38px;
				display: flex;
				align-items: center;
				justify-content: center;
				border: 1px solid color-mix(in srgb, var(--loader-primary) 18%, transparent);
				border-radius: 12px;
				background: color-mix(in srgb, var(--loader-background) 60%, var(--loader-primary) 10%);
				box-shadow: 0 4px 14px color-mix(in srgb, var(--loader-primary) 16%, transparent);
			}

			.brand-mark svg {
				width: 23px;
				height: 23px;
				color: var(--loader-primary);
				filter: drop-shadow(0 1px 3px color-mix(in srgb, var(--loader-primary) 25%, transparent));
			}

			.loader-brand {
				color: var(--loader-text);
				font-size: 0.875rem;
				font-weight: 700;
				letter-spacing: 0.015em;
				line-height: 1.2;
			}

			.loader-text {
				color: var(--loader-text);
				font-size: 0.75rem;
				font-weight: 500;
				letter-spacing: 0.01em;
				margin-top: -7px;
				line-height: 1.2;
				white-space: nowrap;
			}

			.loader-progress {
				width: 112px;
				height: 3px;
				margin-top: 3px;
				overflow: hidden;
				border-radius: 999px;
				background: var(--loader-track);
			}

			.loader-progress::after {
				display: block;
				width: 42%;
				height: 100%;
				border-radius: inherit;
				background: var(--loader-primary);
				content: "";
				animation: loader-progress 1.4s ease-in-out infinite;
			}

			@media (prefers-reduced-motion: reduce) {
				#appLoader,
				.loader-spinner,
				.loader-progress::after {
					animation: none;
				}
			}

			@keyframes loader-spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			@keyframes loader-progress {
				0% {
					transform: translateX(-120%);
				}
				100% {
					transform: translateX(260%);
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>

		<div id="appLoader" role="status" aria-live="polite" aria-label="Loading Servio">
			<div class="loader-container">
				<div class="glow-bg"></div>
				<div class="loader-ring-wrapper">
					<div class="loader-track"></div>
					<div class="loader-spinner"></div>
					<div class="brand-mark" aria-hidden="true">
						<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M4 10.5h16l-1.3 8.1a1.7 1.7 0 0 1-1.68 1.43H6.98A1.7 1.7 0 0 1 5.3 18.6L4 10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
							<path d="M3 10.5 6.4 5h11.2l3.4 5.5M8.5 5V3.7h7V5M8 14.1h8M9.2 17h5.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
						</svg>
					</div>
				</div>
				<div class="loader-brand">Servio</div>
				<div class="loader-text">Loading your workspace</div>
				<div class="loader-progress" aria-hidden="true"></div>
			</div>
		</div>

		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
