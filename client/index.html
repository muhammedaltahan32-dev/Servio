<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Servio</title>
		<style>
			:root {
				--loader-background: #f3f6fb;
				--loader-primary: #0d8a68;
				--loader-text: #63738b;
				--loader-brand-text: #ffffff;
				--loader-track: rgba(23, 36, 59, 0.08);
			}

			:root.dark,
			:root[data-mui-color-scheme="dark"] {
				--loader-background: #121212;
				--loader-primary: #55c99a;
				--loader-text: #b3b3b3;
				--loader-brand-text: #121212;
				--loader-track: rgba(255, 255, 255, 0.12);
			}

			@media (prefers-color-scheme: dark) {
				:root:not(.light):not([data-mui-color-scheme="light"]) {
					--loader-background: #121212;
					--loader-primary: #55c99a;
					--loader-text: #b3b3b3;
					--loader-brand-text: #121212;
					--loader-track: rgba(255, 255, 255, 0.12);
				}
			}

			#appLoader {
				position: fixed;
				inset: 0;
				height: 100dvh;
				width: 100dvw;
				z-index: 99999;
				display: flex;
				align-items: center;
				justify-content: center;
				background-color: var(--loader-background);
				background-image: radial-gradient(ellipse at center, color-mix(in srgb, var(--loader-primary) 8%, transparent), transparent 58%);
				opacity: 1;
				visibility: visible;
				transition:
					opacity 0.4s ease,
					visibility 0.4s ease;
				overflow: hidden;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
			}

			/* Removal State */
			#appLoader.loaded {
				opacity: 0 !important;
				visibility: hidden !important;
				pointer-events: none !important;
			}

			.loader-container {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 20px;
				position: relative;
				z-index: 1;
			}

			.glow-bg {
				position: absolute;
				width: 320px;
				height: 320px;
				border-radius: 50%;
				background: radial-gradient(circle, var(--loader-primary) 0%, transparent 70%);
				opacity: 0.12;
				filter: blur(60px);
				pointer-events: none;
			}

			.loader-ring-wrapper {
				position: relative;
				width: 64px;
				height: 64px;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.loader-track {
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 3px solid var(--loader-track);
			}

			.loader-spinner {
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 3px solid transparent;
				border-top-color: var(--loader-primary);
				animation: loader-spin 1s linear infinite;
			}

			.brand-badge {
				width: 34px;
				height: 34px;
				border-radius: 8px;
				background-color: var(--loader-primary);
				color: var(--loader-brand-text);
				font-weight: 800;
				font-size: 0.95rem;
				display: flex;
				align-items: center;
				justify-content: center;
				box-shadow: 0 6px 16px color-mix(in srgb, var(--loader-primary) 35%, transparent);
			}

			.loader-text {
				color: var(--loader-text);
				font-size: 0.875rem;
				font-weight: 600;
				letter-spacing: 0.5px;
				animation: loader-fade 1.5s ease-in-out infinite;
			}

			@media (prefers-reduced-motion: reduce) {
				#appLoader,
				.loader-spinner,
				.loader-text {
					animation: none;
					transition: none;
				}
			}

			@keyframes loader-spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			@keyframes loader-fade {
				0%,
				100% {
					opacity: 0.4;
				}
				50% {
					opacity: 1;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>

		<div id="appLoader" role="status" aria-live="polite" aria-label="Loading Servio">
			<div class="loader-container">
				<div class="glow-bg"></div>
				<div class="loader-ring-wrapper">
					<div class="loader-track"></div>
					<div class="loader-spinner"></div>
				<div class="brand-badge" aria-hidden="true">S</div>
				</div>
				<div class="loader-text">Loading Servio...</div>
			</div>
		</div>

		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
